name: 'Tests'

on:
  push:
    branches:
      - '*'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run Tests
        run: go test ./... -race -coverprofile=coverage.txt -covermode=atomic -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
